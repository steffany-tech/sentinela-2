<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Sistema Hospitalar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container login-container">
    <div class="brand-icon" aria-hidden="true">✚</div>
    <p class="eyebrow">Acesso seguro</p>
    <h1>Sistema Hospitalar</h1>
    <p class="subtitle">Entre com seus dados para continuar.</p>

    <form id="formLogin">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" placeholder="Seu usuário" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="Sua senha" autocomplete="current-password" required>
      <p id="mensagem" class="message" role="status" aria-live="polite"></p>
      <button id="botaoEntrar" type="submit">Entrar</button>
    </form>
  </main>

  <script>
    const formLogin = document.getElementById("formLogin");
    const mensagem = document.getElementById("mensagem");
    const botaoEntrar = document.getElementById("botaoEntrar");

    formLogin.addEventListener("submit", async event => {
      event.preventDefault();
      mensagem.textContent = "";
      botaoEntrar.disabled = true;
      botaoEntrar.textContent = "Entrando…";

      try {
        const resposta = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario: document.getElementById("usuario").value.trim(),
            senha: document.getElementById("senha").value
          })
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Não foi possível entrar.");

        const destinos = {
          triagem: "triagem.html",
          medico: "medico.html",
          atendimento: "atendimento.html",
          almoxarifado: "almoxerifado.html",
          admin: "admin.html"
        };
        const destino = destinos[dados.tipo];
        if (!destino) throw new Error("Perfil de usuário não reconhecido.");

        // Keep the authenticated profile available to pages that verify permissions.
        sessionStorage.setItem("hospitalar_user", JSON.stringify(dados));
        sessionStorage.setItem("hospitalar_token", `sessao-${Date.now()}`);
        localStorage.setItem("hospitalar_user", JSON.stringify(dados));
        window.location.assign(destino);
      } catch (erro) {
        mensagem.textContent = erro.message || "Erro de conexão. Tente novamente.";
      } finally {
        botaoEntrar.disabled = false;
        botaoEntrar.textContent = "Entrar";
      }
    });

    window.addEventListener("keydown", event => {
      if (event.ctrlKey && event.altKey && event.key.toLowerCase() === "a") {
        event.preventDefault();
        window.location.assign("admin.html");
      }
    });
  </script>
</body>
</html>
